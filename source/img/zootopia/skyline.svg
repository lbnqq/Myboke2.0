<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9F43;stop-opacity:0.6"/>
      <stop offset="33%" style="stop-color:#0ABDE3;stop-opacity:0.6"/>
      <stop offset="66%" style="stop-color:#10AC84;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#5F27CD;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="buildingGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9F43"/>
      <stop offset="100%" style="stop-color:#EE5A24"/>
    </linearGradient>
    <linearGradient id="buildingGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0ABDE3"/>
      <stop offset="100%" style="stop-color:#48DBFB"/>
    </linearGradient>
    <linearGradient id="buildingGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10AC84"/>
      <stop offset="100%" style="stop-color:#1DD1A1"/>
    </linearGradient>
    <linearGradient id="buildingGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5F27CD"/>
      <stop offset="100%" style="stop-color:#8854D0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景渐变带 -->
  <rect x="0" y="85" width="800" height="35" rx="4" fill="url(#skyGrad)" opacity="0.3"/>

  <!-- Sahara Square 区域 (金橙) -->
  <!-- 沙漠宫殿 -->
  <rect x="10" y="50" width="25" height="50" rx="2" fill="url(#buildingGrad1)" opacity="0.9"/>
  <polygon points="22.5,30 5,50 40,50" fill="#FFD700" opacity="0.8"/>
  <rect x="18" y="65" width="8" height="10" rx="1" fill="#FFF5E6" opacity="0.7"/>
  <!-- 圆顶建筑 -->
  <rect x="42" y="55" width="20" height="45" rx="2" fill="url(#buildingGrad1)" opacity="0.8"/>
  <ellipse cx="52" cy="55" rx="10" ry="8" fill="#FFD700" opacity="0.7"/>
  <!-- 棕榈树 -->
  <line x1="70" y1="95" x2="70" y2="70" stroke="#10AC84" stroke-width="2"/>
  <ellipse cx="70" cy="68" rx="8" ry="5" fill="#1DD1A1" opacity="0.6"/>

  <!-- Tundratown 区域 (冰蓝) -->
  <!-- 冰塔 -->
  <rect x="110" y="35" width="18" height="65" rx="3" fill="url(#buildingGrad2)" opacity="0.9"/>
  <polygon points="119,20 108,35 130,35" fill="#C7ECEE" opacity="0.8"/>
  <!-- 雪花圆顶 -->
  <rect x="135" y="50" width="22" height="50" rx="2" fill="url(#buildingGrad2)" opacity="0.85"/>
  <circle cx="146" cy="48" r="10" fill="#DFE6E9" opacity="0.6"/>
  <!-- 冰晶楼 -->
  <rect x="164" y="45" width="15" height="55" rx="2" fill="#48DBFB" opacity="0.8"/>
  <rect x="167" y="35" width="9" height="15" rx="1" fill="#C7ECEE" opacity="0.7"/>
  <!-- 雪花装饰 -->
  <circle cx="185" cy="40" r="2" fill="#fff" opacity="0.5" filter="url(#glow)"/>
  <circle cx="195" cy="55" r="1.5" fill="#fff" opacity="0.4" filter="url(#glow)"/>

  <!-- Downtown 区域 (紫色) -->
  <!-- 摩天大楼群 -->
  <rect x="220" y="20" width="14" height="80" rx="2" fill="url(#buildingGrad4)" opacity="0.9"/>
  <rect x="222" y="18" width="10" height="5" rx="1" fill="#8854D0" opacity="0.8"/>
  <rect x="240" y="30" width="18" height="70" rx="2" fill="url(#buildingGrad4)" opacity="0.85"/>
  <rect x="262" y="40" width="22" height="60" rx="2" fill="url(#buildingGrad4)" opacity="0.9"/>
  <polygon points="273,28 260,40 286,40" fill="#A55EEA" opacity="0.7"/>
  <rect x="290" y="25" width="12" height="75" rx="2" fill="url(#buildingGrad4)" opacity="0.8"/>
  <!-- 窗户灯光 -->
  <rect x="244" y="38" width="3" height="3" rx="0.5" fill="#FFF5E6" opacity="0.6"/>
  <rect x="250" y="45" width="3" height="3" rx="0.5" fill="#FFF5E6" opacity="0.5"/>
  <rect x="266" y="48" width="4" height="3" rx="0.5" fill="#FFF5E6" opacity="0.6"/>
  <rect x="266" y="58" width="4" height="3" rx="0.5" fill="#FFF5E6" opacity="0.5"/>
  <rect x="293" y="35" width="3" height="3" rx="0.5" fill="#FFF5E6" opacity="0.6"/>

  <!-- Rainforest District (翠绿) -->
  <!-- 树屋 -->
  <rect x="330" y="55" width="28" height="45" rx="4" fill="url(#buildingGrad3)" opacity="0.85"/>
  <circle cx="344" cy="50" r="14" fill="#1DD1A1" opacity="0.5"/>
  <circle cx="335" cy="45" r="10" fill="#2ED573" opacity="0.4"/>
  <!-- 藤蔓建筑 -->
  <rect x="365" y="50" width="20" height="50" rx="3" fill="url(#buildingGrad3)" opacity="0.8"/>
  <line x1="375" y1="50" x2="375" y2="30" stroke="#2ED573" stroke-width="2" opacity="0.6"/>
  <circle cx="375" cy="28" r="5" fill="#10AC84" opacity="0.5"/>
  <!-- 瀑布 -->
  <rect x="392" y="45" width="8" height="55" rx="4" fill="#48DBFB" opacity="0.3"/>
  <rect x="394" y="40" width="4" height="60" rx="2" fill="#0ABDE3" opacity="0.2"/>
  <!-- 叶片装饰 -->
  <ellipse cx="410" cy="50" rx="6" ry="3" fill="#2ED573" opacity="0.4" transform="rotate(-20,410,50)"/>

  <!-- 桥梁连接 -->
  <rect x="425" y="75" width="35" height="3" rx="1.5" fill="#FF9F43" opacity="0.5"/>
  <line x1="430" y1="78" x2="430" y2="85" stroke="#FF9F43" stroke-width="1" opacity="0.4"/>
  <line x1="440" y1="78" x2="440" y2="85" stroke="#FF9F43" stroke-width="1" opacity="0.4"/>
  <line x1="450" y1="78" x2="450" y2="85" stroke="#FF9F43" stroke-width="1" opacity="0.4"/>

  <!-- Meadowlands / Savanna -->
  <!-- 小山丘 -->
  <ellipse cx="500" cy="95" rx="30" ry="15" fill="#1DD1A1" opacity="0.3"/>
  <ellipse cx="520" cy="95" rx="25" ry="12" fill="#10AC84" opacity="0.25"/>
  <!-- 草屋 -->
  <rect x="495" y="60" width="18" height="35" rx="2" fill="#FF9F43" opacity="0.7"/>
  <polygon points="504,48 492,60 516,60" fill="#EE5A24" opacity="0.6"/>
  <!-- 稻草人 -->
  <line x1="530" y1="95" x2="530" y2="72" stroke="#B8860B" stroke-width="1.5"/>
  <line x1="523" y1="80" x2="537" y2="80" stroke="#B8860B" stroke-width="1"/>
  <circle cx="530" cy="70" r="3" fill="#FFD700" opacity="0.6"/>

  <!-- ZPD总部 (右侧核心建筑) -->
  <rect x="580" y="25" width="40" height="75" rx="4" fill="url(#buildingGrad1)" opacity="0.9"/>
  <rect x="575" y="20" width="50" height="8" rx="2" fill="#FFD700" opacity="0.7"/>
  <rect x="595" y="55" width="10" height="20" rx="2" fill="#0ABDE3" opacity="0.5"/>
  <!-- ZPD 星徽 -->
  <polygon points="600,30 603,38 612,38 605,43 607,51 600,47 593,51 595,43 588,38 597,38"
           fill="#FFD700" opacity="0.8" filter="url(#glow)"/>
  <!-- 停车场 -->
  <rect x="625" y="75" width="25" height="20" rx="2" fill="#576574" opacity="0.3"/>

  <!-- 火车站 -->
  <rect x="660" y="50" width="35" height="50" rx="3" fill="url(#buildingGrad2)" opacity="0.85"/>
  <polygon points="677.5,35 658,50 698,50" fill="#48DBFB" opacity="0.7"/>
  <rect x="670" y="65" width="16" height="10" rx="1" fill="#FFF5E6" opacity="0.5"/>
  <!-- 时钟 -->
  <circle cx="677.5" cy="42" r="4" fill="#FFF5E6" opacity="0.6"/>
  <line x1="677.5" y1="42" x2="677.5" y2="39.5" stroke="#576574" stroke-width="0.5"/>
  <line x1="677.5" y1="42" x2="680" y2="42" stroke="#576574" stroke-width="0.5"/>

  <!-- 右侧小建筑 -->
  <rect x="705" y="60" width="15" height="40" rx="2" fill="url(#buildingGrad3)" opacity="0.7"/>
  <rect x="725" y="65" width="18" height="35" rx="2" fill="url(#buildingGrad4)" opacity="0.7"/>
  <rect x="748" y="55" width="20" height="45" rx="2" fill="url(#buildingGrad1)" opacity="0.7"/>
  <polygon points="758,45 746,55 770,55" fill="#FFD700" opacity="0.5"/>

  <!-- 底部道路 -->
  <rect x="0" y="95" width="800" height="2" rx="1" fill="url(#skyGrad)" opacity="0.6"/>
</svg>
