<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="cGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9F43"/>
      <stop offset="100%" style="stop-color:#EE5A24"/>
    </linearGradient>
    <linearGradient id="cIce" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ABDE3"/>
      <stop offset="100%" style="stop-color:#48DBFB"/>
    </linearGradient>
    <linearGradient id="cGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10AC84"/>
      <stop offset="100%" style="stop-color:#1DD1A1"/>
    </linearGradient>
    <linearGradient id="cPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5F27CD"/>
      <stop offset="100%" style="stop-color:#8854D0"/>
    </linearGradient>
    <filter id="cShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <filter id="cGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 外圈 -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#FF9F43" stroke-width="1.5" opacity="0.2"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#0ABDE3" stroke-width="0.8" opacity="0.15"/>

  <!-- 刻度线 - 8个方向 -->
  <line x1="100" y1="5" x2="100" y2="12" stroke="#FF9F43" stroke-width="2" opacity="0.5"/>
  <line x1="195" y1="100" x2="188" y2="100" stroke="#0ABDE3" stroke-width="2" opacity="0.5"/>
  <line x1="100" y1="195" x2="100" y2="188" stroke="#10AC84" stroke-width="2" opacity="0.5"/>
  <line x1="5" y1="100" x2="12" y2="100" stroke="#5F27CD" stroke-width="2" opacity="0.5"/>

  <line x1="167" y1="33" x2="162" y2="38" stroke="#FF9F43" stroke-width="1" opacity="0.3"/>
  <line x1="167" y1="167" x2="162" y2="162" stroke="#10AC84" stroke-width="1" opacity="0.3"/>
  <line x1="33" y1="167" x2="38" y2="162" stroke="#5F27CD" stroke-width="1" opacity="0.3"/>
  <line x1="33" y1="33" x2="38" y2="38" stroke="#0ABDE3" stroke-width="1" opacity="0.3"/>

  <!-- 主指针 - 北 (Sahara 金橙) -->
  <polygon points="100,18 93,72 100,62 107,72" fill="url(#cGold)" filter="url(#cShadow)" opacity="0.9"/>

  <!-- 主指针 - 东 (Tundratown 冰蓝) -->
  <polygon points="182,100 128,93 138,100 128,107" fill="url(#cIce)" filter="url(#cShadow)" opacity="0.9"/>

  <!-- 主指针 - 南 (Rainforest 翠绿) -->
  <polygon points="100,182 93,128 100,138 107,128" fill="url(#cGreen)" filter="url(#cShadow)" opacity="0.9"/>

  <!-- 主指针 - 西 (Downtown 紫色) -->
  <polygon points="18,100 72,93 62,100 72,107" fill="url(#cPurple)" filter="url(#cShadow)" opacity="0.9"/>

  <!-- 副指针 - 东北 -->
  <polygon points="155,45 112,85 118,82 115,88" fill="#FF9F43" opacity="0.35"/>
  <!-- 副指针 - 东南 -->
  <polygon points="155,155 115,112 118,118 112,115" fill="#0ABDE3" opacity="0.35"/>
  <!-- 副指针 - 西南 -->
  <polygon points="45,155 88,115 82,118 85,112" fill="#10AC84" opacity="0.35"/>
  <!-- 副指针 - 西北 -->
  <polygon points="45,45 85,88 82,82 88,85" fill="#5F27CD" opacity="0.35"/>

  <!-- 中心装饰环 -->
  <circle cx="100" cy="100" r="16" fill="white" stroke="#FF9F43" stroke-width="1.5" filter="url(#cShadow)"/>
  <circle cx="100" cy="100" r="10" fill="none" stroke="url(#cGold)" stroke-width="1" opacity="0.6"/>

  <!-- 中心爪印 -->
  <ellipse cx="100" cy="103" rx="4" ry="4.5" fill="url(#cGold)" opacity="0.8"/>
  <circle cx="96" cy="97" r="1.8" fill="#FF9F43" opacity="0.7"/>
  <circle cx="99" cy="95.5" r="1.8" fill="#0ABDE3" opacity="0.7"/>
  <circle cx="102" cy="95.5" r="1.8" fill="#10AC84" opacity="0.7"/>
  <circle cx="105" cy="97" r="1.8" fill="#5F27CD" opacity="0.7"/>

  <!-- 方位标记 -->
  <text x="100" y="30" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#FF9F43" font-weight="bold" opacity="0.7">N</text>
  <text x="174" y="103" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#0ABDE3" font-weight="bold" opacity="0.7">E</text>
  <text x="100" y="178" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#10AC84" font-weight="bold" opacity="0.7">S</text>
  <text x="26" y="103" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#5F27CD" font-weight="bold" opacity="0.7">W</text>
</svg>
