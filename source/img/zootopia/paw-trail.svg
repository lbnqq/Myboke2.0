<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 60" width="600" height="60">
  <defs>
    <linearGradient id="pawGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9F43"/>
      <stop offset="50%" style="stop-color:#0ABDE3"/>
      <stop offset="100%" style="stop-color:#10AC84"/>
    </linearGradient>
    <linearGradient id="pawGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ABDE3"/>
      <stop offset="50%" style="stop-color:#10AC84"/>
      <stop offset="100%" style="stop-color:#FF9F43"/>
    </linearGradient>
    <!-- 爪印符号，可复用 -->
    <g id="paw">
      <!-- 主肉垫 -->
      <ellipse cx="0" cy="4" rx="5.5" ry="6" />
      <!-- 四个脚趾 -->
      <circle cx="-5" cy="-5" r="2.5" />
      <circle cx="-1.5" cy="-7" r="2.5" />
      <circle cx="2" cy="-7" r="2.5" />
      <circle cx="5.5" cy="-5" r="2.5" />
    </g>
  </defs>

  <!-- 装饰波浪底线 -->
  <path d="M0,40 Q75,25 150,38 T300,36 T450,38 T600,35"
        fill="none" stroke="url(#pawGrad1)" stroke-width="1" opacity="0.25"/>

  <!-- 爪印序列：大→小渐变，模拟行走轨迹 -->
  <!-- 第1步 - 最大 -->
  <use href="#paw" x="30" y="30" fill="url(#pawGrad1)" opacity="0.8" transform="scale(1.2)"/>
  <!-- 第2步 -->
  <use href="#paw" x="85" y="24" fill="url(#pawGrad1)" opacity="0.72" transform="rotate(-8,85,24)"/>
  <!-- 第3步 -->
  <use href="#paw" x="140" y="32" fill="#0ABDE3" opacity="0.65"/>
  <!-- 第4步 -->
  <use href="#paw" x="195" y="22" fill="#0ABDE3" opacity="0.58" transform="rotate(5,195,22)"/>
  <!-- 第5步 - 中等 -->
  <use href="#paw" x="250" y="28" fill="url(#pawGrad2)" opacity="0.5"/>
  <!-- 第6步 -->
  <use href="#paw" x="305" y="20" fill="#10AC84" opacity="0.45" transform="rotate(-6,305,20)"/>
  <!-- 第7步 -->
  <use href="#paw" x="360" y="26" fill="#10AC84" opacity="0.38"/>
  <!-- 第8步 - 渐小 -->
  <use href="#paw" x="415" y="18" fill="url(#pawGrad1)" opacity="0.32" transform="rotate(8,415,18) scale(0.9)"/>
  <!-- 第9步 -->
  <use href="#paw" x="468" y="24" fill="#FF9F43" opacity="0.26" transform="scale(0.85)"/>
  <!-- 第10步 - 最小最淡 -->
  <use href="#paw" x="520" y="16" fill="url(#pawGrad2)" opacity="0.2" transform="rotate(-4,520,16) scale(0.8)"/>

  <!-- 小星星点缀 -->
  <circle cx="55" cy="15" r="1.2" fill="#FF9F43" opacity="0.4"/>
  <circle cx="170" cy="12" r="1" fill="#0ABDE3" opacity="0.35"/>
  <circle cx="280" cy="10" r="1.3" fill="#10AC84" opacity="0.3"/>
  <circle cx="390" cy="8" r="1" fill="#FF9F43" opacity="0.25"/>
  <circle cx="500" cy="6" r="1.2" fill="#0ABDE3" opacity="0.2"/>

  <!-- 小圆点散落 -->
  <circle cx="110" cy="38" r="0.8" fill="#FF9F43" opacity="0.2"/>
  <circle cx="225" cy="40" r="0.8" fill="#0ABDE3" opacity="0.18"/>
  <circle cx="340" cy="38" r="0.8" fill="#10AC84" opacity="0.15"/>
  <circle cx="455" cy="36" r="0.8" fill="#FF9F43" opacity="0.12"/>
</svg>
